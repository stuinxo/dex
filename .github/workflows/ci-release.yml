name: DEX CI & Release

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"

      - name: Shell syntax & safety checks
        run: |
          sh -n scripts/install.sh
          sh -n i
          cmp -s i scripts/install.sh
          ! grep -rn -- '--no-check-certificate' i scripts/ internal/ cmd/
          ! grep -rnE 'rm[[:space:]]+(-rf|-f)[[:space:]]+(/var/lib/(apt|dpkg)/.*lock|/var/cache/apt/archives/lock)' i scripts/

      - name: Go vet & race tests
        run: |
          go vet ./...
          go test -race -count=1 ./...

      - name: Cross-compile static binaries
        run: |
          mkdir -p dist
          if [ "${GITHUB_REF_TYPE:-}" = "tag" ]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="0.0.3-dev"
          fi
          COMMIT="${GITHUB_SHA::7}"
          BUILD_TIME="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          LDFLAGS="-s -w -X github.com/stuinxo/dex/internal/version.Version=${VERSION} -X github.com/stuinxo/dex/internal/version.Commit=${COMMIT} -X github.com/stuinxo/dex/internal/version.BuildTime=${BUILD_TIME}"
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath -ldflags="${LDFLAGS}" -o dist/dex-linux-amd64 ./cmd/dex
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -trimpath -ldflags="${LDFLAGS}" -o dist/dex-linux-arm64 ./cmd/dex
          (cd dist && sha256sum dex-linux-amd64 dex-linux-arm64 > SHA256SUMS)
          file dist/dex-linux-amd64 dist/dex-linux-arm64

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dex-binaries
          path: dist/

  release:
    needs: verify
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: dex-binaries
          path: dist

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            gh release upload "${GITHUB_REF_NAME}" --clobber \
              dist/dex-linux-amd64 \
              dist/dex-linux-arm64 \
              dist/SHA256SUMS \
              scripts/install.sh
          else
            gh release create "${GITHUB_REF_NAME}" \
              dist/dex-linux-amd64 \
              dist/dex-linux-arm64 \
              dist/SHA256SUMS \
              scripts/install.sh \
              --title "DEX ${GITHUB_REF_NAME}" \
              --generate-notes
          fi
